name: Build Android APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv git zip unzip openjdk-17-jdk-headless autoconf libtool pkg-config libssl-dev libffi-dev cmake

      - name: Install buildozer
        run: python3 -m pip install --user buildozer

      - name: Build debug APK
        run: ~/.local/bin/buildozer android debug

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: bin/*.apk
